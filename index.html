<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="clckd" content="c9778c774027ed6880257b85607d4e73" />
  <link rel="icon" type="image/png" href="/movix-app/1790247122495.png" />
  <title>Movix</title>

  <style>
    /* منع ظهور أي لون أبيض فور فتح الصفحة */
    html, body {
      background-color: #05070A !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* شاشة البداية المبكرة */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #05070A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashFadeIn 0.8s ease-out forwards;
    }

    .splash-logo {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.45));
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .splash-title {
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 800;
      margin-top: 18px;
      margin-bottom: 4px;
      letter-spacing: 2px;
    }

    .splash-title span {
      color: #3B82F6;
    }

    .splash-subtitle {
      color: #9CA3AF;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.35));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 32px rgba(59, 130, 246, 0.65));
      }
    }

    @keyframes splashFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- شاشة Splash تعمل فورًا قبل تحميل React -->
  <div id="splash-screen">
    <div class="splash-content">
      <img src="/movix-app/1790247122495.png" alt="MOVIX" class="splash-logo" />
      <div class="splash-title">MOV<span>IX</span></div>
      <div class="splash-subtitle">Movie Streaming</div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
