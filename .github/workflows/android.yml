name: Build Android and Upload Capgo OTA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Deploy to Capgo OTA
        run: npx @capgo/cli@latest upload -a ${{ secrets.CAPGO_TOKEN }}
