name: Build Android and Upload Capgo OTA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.0.0 @capacitor/android@6.0.0 --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Patch Android SDK Version directly
        run: |
          python3 -c "
          import re
          path = 'android/variables.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 34', content)
          content = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 34', content)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Deploy to Capgo OTA
        run: npx @capgo/cli bundle upload -a ${{ secrets.CAPGO_TOKEN }} --no-code-check

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
