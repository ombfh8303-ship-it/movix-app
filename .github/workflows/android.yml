name: Build Android and Upload Capgo OTA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform
        run: npx @capacitor/cli add android || true

      - name: Capacitor Sync
        run: npx @capacitor/cli sync android

      - name: Deploy to Capgo OTA
        run: npx @capgo/cli bundle upload -a ${{ secrets.CAPGO_TOKEN }} --no-code-check
